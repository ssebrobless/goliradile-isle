name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GODOT_VERSION: "4.6-stable"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p .godot-bin
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d .godot-bin
          chmod +x ".godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64"

      - name: Run checks (selftest, balance table, soak, defense)
        run: GODOT="$PWD/.godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64" ci/run_checks.sh

      - name: Upload tool outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-output
          path: ci/out
          if-no-files-found: ignore
